<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brix Runner</title>
<style>
  :root{
    --sky-top:#d8f0e0;
    --sky-bottom:#f1faf3;
    --ground:#8a5a3b;
    --ground-dark:#6e4429;
    --ui:#1f3a2c;
    --accent:#2fa84f;
    --accent-dark:#1f7a38;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom));
    font-family:'Trebuchet MS', 'Segoe UI', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  #wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  h1{
    margin:0;
    color:var(--ui);
    font-size:28px;
    letter-spacing:1px;
    text-shadow:0 2px 0 rgba(255,255,255,.6);
  }
  #hint{
    color:#355544;
    font-size:13px;
  }
  #stage{
    position:relative;
    width:800px;
    max-width:94vw;
    height:300px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.25), inset 0 0 0 4px #ffffffaa;
    background:#dff0ff;
  }
  #bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:saturate(0.9) brightness(0.6) blur(1px);
    transform:scale(1.05);
  }
  #bgTint{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(20,60,35,.2), rgba(10,35,20,.55));
  }
  canvas{
    position:relative;
    display:block;
    width:100%;
    height:100%;
  }
  #scoreBox{
    position:absolute;
    top:10px;
    right:16px;
    color:#fff;
    font-weight:bold;
    font-size:16px;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
    letter-spacing:1px;
  }
  #overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(10,20,15,.55);
    color:#fff;
    text-align:center;
    gap:10px;
    transition:opacity .2s ease;
  }
  #overlay.hidden{ display:none; }
  #overlay h2{
    margin:0;
    font-size:26px;
    text-shadow:0 2px 4px rgba(0,0,0,.6);
  }
  #overlay p{
    margin:0;
    font-size:14px;
    opacity:.9;
  }
  #startPhoto{
    width:72px;
    height:72px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #fff;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  button{
    margin-top:6px;
    padding:10px 22px;
    font-size:15px;
    font-weight:bold;
    border:none;
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 0 var(--accent-dark);
  }
  button:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 var(--accent-dark);
  }
</style>
</head>
<body>

  const PLAYER_SIZE = 56;
  const DUCK_SIZE = 38;

  let player = {
    x: 70,
    y: GROUND_Y - PLAYER_SIZE,
    w: PLAYER_SIZE,
    h: PLAYER_SIZE,
    vy: 0,
    ducking: false,
    grounded: true
  };

  const GRAVITY = 0.62;
  const JUMP_V = -12.4;

  let obstacles = [];
  let frame = 0;
  let speed = 6.2;
  let score = 0;
  let running = false;
  let gameOver = false;
  let spawnTimer = 0;
  let nextSpawn = 70;
  let flashFrames = 0;

  function resetGame(){
    player.y = GROUND_Y - PLAYER_SIZE;
    player.h = PLAYER_SIZE;
    player.vy = 0;
    player.ducking = false;
    player.grounded = true;
    obstacles = [];
    frame = 0;
    speed = 6.2;
    score = 0;
    spawnTimer = 0;
    nextSpawn = 70;
    gameOver = false;
    scoreEl.textContent = "0";
  }

  function jump(){
    if(!running){ startGame(); return; }
    if(gameOver){ startGame(); return; }
    if(player.grounded && !player.ducking){
      player.vy = JUMP_V;
      player.grounded = false;
    }
  }

  function setDuck(v){
    if(!running || gameOver) return;
    player.ducking = v && player.grounded;
    player.h = player.ducking ? DUCK_SIZE : PLAYER_SIZE;
    player.y = GROUND_Y - player.h;
  }

  function startGame(){
    resetGame();
    running = true;
    overlay.classList.add('hidden');
  }

  function spawnObstacle(){
    const isFlyer = Math.random() < 0.28 && score > 5;
    if(isFlyer){
      const h = 26;
      obstacles.push({
        x: W + 10, y: GROUND_Y - PLAYER_SIZE - 18 - Math.random()*20,
        w: 34, h: h, type:'fly'
      });
    } else {
      const clusterSize = Math.random() < 0.25 ? 2 : 1;
      let offset = 0;
      for(let i=0;i<clusterSize;i++){
        const h = 30 + Math.random()*20;
        const w = 18 + Math.random()*10;
        obstacles.push({
          x: W + 10 + offset, y: GROUND_Y - h, w: w, h: h, type:'cactus'
        });
        offset += w + 12;
      }
    }
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function update(){
    frame++;
    if(frame % 300 === 0) speed += 0.5;

    if(!player.grounded){
      player.vy += GRAVITY;
      player.y += player.vy;
      if(player.y >= GROUND_Y - player.h){
        player.y = GROUND_Y - player.h;
        player.vy = 0;
        player.grounded = true;
      }
    }

    spawnTimer++;
    if(spawnTimer > nextSpawn){
      spawnObstacle();
      spawnTimer = 0;
      nextSpawn = 55 + Math.random()*55 - Math.min(speed*2, 30);
      if(nextSpawn < 32) nextSpawn = 32;
    }

    for(let i=obstacles.length-1;i>=0;i--){
      obstacles[i].x -= speed;
      if(obstacles[i].x + obstacles[i].w < -10) obstacles.splice(i,1);
    }

    const hitbox = {
      x: player.x + 8, y: player.y + 6,
      w: player.w - 16, h: player.h - 10
    };
    for(const o of obstacles){
      if(rectsOverlap(hitbox, o)){
        flashFrames = 8;
        endGame();
        break;
      }
    }

    if(frame % 6 === 0){
      score++;
      scoreEl.textContent = score;
    }
  }

    gameOver = true;

      e.stopPropagation();
      startGame();
    });

  function drawGround(){
    ctx.fillStyle = "#7a4e30";
    ctx.fillRect(0, GROUND_Y, W, H-GROUND_Y);
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    const off = (frame*speed) % 40;
    ctx.beginPath();
    for(let x = -off; x < W; x += 40){
      ctx.moveTo(x, GROUND_Y+6);
      ctx.lineTo(x+20, GROUND_Y+6);
    }
    ctx.stroke();
  }

  function drawPlayer(){
    ctx.save();
    const r = player.w/2;
    const cx = player.x + player.w/2;
    const cy = player.y + player.h/2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.closePath();
    ctx.strokeStyle = "#2fa84f";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.save();
    ctx.clip();
    ctx.drawImage(photo, player.x, player.y, player.w, player.h);
    ctx.restore();
    ctx.restore();
  }

  function drawObstacles(){
    for(const o of obstacles){
      if(o.type === 'cactus'){
        ctx.fillStyle = "#2f6b3a";
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle = "#245430";
        ctx.fillRect(o.x-4, o.y+8, 4, 10);
        ctx.fillRect(o.x+o.w, o.y+4, 4, 10);
      } else {
        ctx.fillStyle = "#c0392b";
        ctx.beginPath();
        ctx.ellipse(o.x+o.w/2, o.y+o.h/2, o.w/2, o.h/2, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        const flap = Math.sin(frame*0.4) * 6;
        ctx.beginPath();
        ctx.moveTo(o.x, o.y+o.h/2);
        ctx.lineTo(o.x-10, o.y+o.h/2 - 8 + flap);
        ctx.lineTo(o.x-2, o.y+o.h/2);
        ctx.fill();
      }
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    drawGround();
    drawObstacles();
    drawPlayer();
    if(flashFrames > 0){
      ctx.fillStyle = "rgba(220,30,30,0.35)";
      ctx.fillRect(0,0,W,H);
      flashFrames--;
    }
  }

  function loop(){
    if(running){
      update();
      draw();
    } else if(flashFrames > 0){
      draw();
    }
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      jump();
    } else if(e.code === 'ArrowDown'){
      e.preventDefault();
      setDuck(true);
    }
  });
  document.addEventListener('keyup', (e)=>{
    if(e.code === 'ArrowDown') setDuck(false);
  });

  canvas.addEventListener('touchstart', (e)=>{
    e.preventDefault();
    jump();
  }, {passive:false});
  canvas.addEventListener('mousedown', jump);

  startBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    startGame();
  });

  draw();
  requestAnimationFrame(loop);
})();
</script>
